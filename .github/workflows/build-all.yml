name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      android:
        description: "构建 Android APK"
        type: boolean
        default: true
      ios:
        description: "构建 iOS TrollStore IPA"
        type: boolean
        default: true
      macos:
        description: "构建 macOS DMG"
        type: boolean
        default: true
      windows:
        description: "构建 Windows EXE / ZIP"
        type: boolean
        default: true

jobs:
  android:
    name: Android APK
    if: ${{ inputs.android }}
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  ios:
    name: iOS IPA
    if: ${{ inputs.ios }}
    uses: ./.github/workflows/build-ipa.yml

  macos:
    name: macOS DMG
    if: ${{ inputs.macos }}
    uses: ./.github/workflows/build-mac.yml

  windows:
    name: Windows EXE
    if: ${{ inputs.windows }}
    uses: ./.github/workflows/build-windows.yml
