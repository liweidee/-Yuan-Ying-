# .github/workflows/build-android.yml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ===== 新增：Python 环境（serious_python 需要） =====
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "assets/python/requirements.txt" ]; then
            pip install -r assets/python/requirements.txt
          fi

      - name: Set SERIOUS_PYTHON_SITE_PACKAGES
        run: |
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV
          echo "SERIOUS_PYTHON_SITE_PACKAGES set to $SITE_PACKAGES"

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30