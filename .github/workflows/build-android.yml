name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: Resolve Version
        id: version
        run: bash .github/scripts/resolve_version.sh

      - name: Prepare Fixed Signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            value="${!name}"
            if [[ -z "${value}" ]]; then
              echo "缺少 GitHub Secret: ${name}" >&2
              exit 1
            fi
          done
          export KEY_PASSWORD="${KEYSTORE_PASSWORD}"
          KEYSTORE_PATH="${RUNNER_TEMP}/yuanying-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          keytool -list \
            -keystore "${KEYSTORE_PATH}" \
            -alias "${KEY_ALIAS}" \
            -storepass:env KEYSTORE_PASSWORD >/dev/null
          keytool -certreq \
            -keystore "${KEYSTORE_PATH}" \
            -alias "${KEY_ALIAS}" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -file "${RUNNER_TEMP}/yuanying-key-check.csr"
          echo "Keystore 私钥密码校验通过。"
          echo "keystore_path=${KEYSTORE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed Android APKs
        env:
          YUANYING_VERSION_NAME: ${{ steps.version.outputs.app_version }}
          YUANYING_VERSION_CODE: ${{ steps.version.outputs.build_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --no-tree-shake-icons \
            --build-name="${{ steps.version.outputs.app_version }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define=pili.name="${{ steps.version.outputs.app_version }}" \
            --dart-define=pili.code="${{ steps.version.outputs.build_number }}" \
            --dart-define=pili.run="${{ steps.version.outputs.run_number }}" \
            --dart-define=pili.hash="${{ steps.version.outputs.commit_short }}"

      - name: Rename and Verify APKs
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          version="${{ steps.version.outputs.display_version }}"
          run_number="${{ steps.version.outputs.run_number }}"
          for source in build/app/outputs/flutter-apk/*.apk; do
            base="$(basename "${source}")"
            case "${base}" in
              app-arm64-v8a-release.apk) abi="arm64-v8a" ;;
              app-armeabi-v7a-release.apk) abi="armeabi-v7a" ;;
              app-x86_64-release.apk) abi="x86_64" ;;
              app-x86-release.apk) abi="x86" ;;
              *) abi="universal" ;;
            esac
            target="artifacts/android/yuanying-android-${abi}-v${version}-r${run_number}.apk"
            cp "${source}" "${target}"
          done

          test "$(find artifacts/android -name '*.apk' -type f | wc -l)" -gt 0
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          build_tools="$(find "${sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in artifacts/android/*.apk; do
            "${build_tools}/apksigner" verify --verbose --print-certs "${apk}"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apks
          path: artifacts/android/*.apk
          archive: false
          retention-days: 30
