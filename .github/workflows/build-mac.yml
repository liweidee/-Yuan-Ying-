name: Build Mac DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Extract version from pubspec.yaml
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      # 提升 macOS 部署目标至 11.0
      - name: Set macOS deployment target to 11.0
        run: |
          # 1. 修改 Podfile 中的平台版本
          if [ -f "macos/Podfile" ]; then
            sed -i '' 's/platform :osx, .*/platform :osx, '\''11.0'\''/' macos/Podfile
          fi

          # 2. 修改 Xcode 项目中的部署目标
          PROJECT_FILE="macos/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PROJECT_FILE" ]; then
            # 将所有 MACOSX_DEPLOYMENT_TARGET = 10.15 替换为 11.0
            sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10\.15;/MACOSX_DEPLOYMENT_TARGET = 11.0;/g' "$PROJECT_FILE"
            # 同时将 SDKROOT 可能也需调整，但通常会自动处理
          fi

          echo "macOS deployment target set to 11.0"

      - name: Install dependencies and build macOS app
        run: |
          flutter pub get
          flutter build macos --release --no-pub

      - name: Create DMG
        run: |
          npm install --global create-dmg
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            create-dmg "$APP_PATH" || true
          else
            echo "No .app found, skipping DMG creation"
            exit 1
          fi

      - name: Rename DMG
        run: mv yuanying*.dmg yuanying_macos_${{ env.VERSION }}.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-dmg
          path: yuanying_macos_*.dmg
          retention-days: 30