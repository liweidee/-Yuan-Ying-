name: Build Mac DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Read version from pubspec.yaml
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ Version: $VERSION"

      - name: Build macOS app
        run: |
          flutter clean
          flutter pub get
          flutter build macos --release --no-pub

      - name: Create and rename DMG
        run: |
          npm install --global create-dmg
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found"
            exit 1
          fi
          echo "✅ Found app: $APP_PATH"
          # 关键修改：跳过签名
          create-dmg --skip-sign "$APP_PATH"
          DMG_FILE=$(find . -maxdepth 1 -name "*.dmg" -type f | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "❌ No DMG created"
            exit 1
          fi
          DMG_FILE=${DMG_FILE#./}
          echo "✅ Generated: $DMG_FILE"
          mv "$DMG_FILE" "Yuanying_macos_${{ env.VERSION }}.dmg"
          echo "✅ Renamed to Yuanying_macos_${{ env.VERSION }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-dmg
          path: Yuanying_macos_*.dmg
          retention-days: 30