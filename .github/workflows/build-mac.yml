name: Build Mac DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Read version from pubspec.yaml
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build macOS app
        run: |
          flutter clean
          flutter pub get
          flutter build macos --release --no-pub

      - name: Create DMG
        run: |
          npm install --global create-dmg
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in build output"
            exit 1
          fi
          echo "Found app: $APP_PATH"

          # 显式指定输出文件名为 yuanying.dmg，并覆盖已有
          create-dmg --overwrite "$APP_PATH" "yuanying.dmg"
          if [ ! -f "yuanying.dmg" ]; then
            echo "❌ DMG creation failed"
            exit 1
          fi
          echo "✅ DMG created: yuanying.dmg"

      - name: Rename DMG
        run: mv yuanying.dmg yuanying_macos_${{ env.VERSION }}.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-dmg
          path: yuanying_macos_*.dmg
          retention-days: 30