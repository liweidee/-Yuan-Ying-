name: Build Mac DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Build Mac
        run: flutter build macos --release --no-pub

      - name: Prepare DMG
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/yuanying.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv yuanying*.dmg yuanying_macos_${{ env.version }}.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-dmg
          path: yuanying_macos_*.dmg
          retention-days: 30