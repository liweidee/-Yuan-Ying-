name: Build Mac DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Extract version from pubspec.yaml
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Build macOS app
        run: flutter build macos --release --no-pub

      - name: Create DMG
        run: |
          npm install --global create-dmg
          # 假设 .app 名称为 yuanying.app（如果不同请修改）
          create-dmg build/macos/Build/Products/Release/yuanying.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv yuanying*.dmg yuanying_macos_${{ env.VERSION }}.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-dmg
          path: yuanying_macos_*.dmg
          retention-days: 30