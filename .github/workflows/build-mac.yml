name: Build Mac DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Read version from pubspec.yaml
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "✅ Version: $VERSION"

      - name: Build macOS app
        run: |
          flutter clean
          flutter pub get
          flutter build macos --release --no-pub

      - name: Create DMG
        run: |
          npm install --global create-dmg
          # 找到生成的 .app（可能包含中文）
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found"
            exit 1
          fi
          echo "✅ Found app: $APP_PATH"

          # 创建临时目录，复制 .app 并重命名为纯英文名称
          TEMP_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$TEMP_DIR/Yuanying.app"
          echo "✅ Copied to temporary directory with English name"

          # 生成 DMG（跳过签名，避免证书错误）
          create-dmg --skip-sign "$TEMP_DIR/Yuanying.app"

          # 默认生成的 DMG 名称为 Yuanying.dmg
          DMG_FILE="Yuanying.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            echo "❌ DMG creation failed - Yuanying.dmg not found"
            exit 1
          fi

          # 重命名为带版本号的最终文件名
          mv "$DMG_FILE" "Yuanying_macos_${{ env.VERSION }}.dmg"
          echo "✅ Renamed to Yuanying_macos_${{ env.VERSION }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-dmg
          path: Yuanying_macos_*.dmg
          retention-days: 30