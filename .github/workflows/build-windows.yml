name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      PYTHONIOENCODING: utf-8
      VSLANG: "1033"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Resolve Version
        id: version
        shell: bash
        run: bash .github/scripts/resolve_version.sh

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: |
          chcp 65001 | Out-Null
          flutter build windows `
            --release `
            --no-pub `
            --build-name="${{ steps.version.outputs.app_version }}" `
            --build-number="${{ steps.version.outputs.build_number }}" `
            --dart-define=pili.name="${{ steps.version.outputs.app_version }}" `
            --dart-define=pili.code="${{ steps.version.outputs.build_number }}" `
            --dart-define=pili.run="${{ steps.version.outputs.run_number }}" `
            --dart-define=pili.hash="${{ steps.version.outputs.commit_short }}"

      - name: Verify Windows Version
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-ChildItem -Path "build\windows" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\runner\\Release$" } |
            Select-Object -First 1
          if ($null -eq $source) {
            throw "未找到 Windows Release 目录"
          }
          $exe = Join-Path $source.FullName "yuanying.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "未找到 $exe"
          }
          $expected = "${{ steps.version.outputs.numeric_version }}"
          $actual = (Get-Item -LiteralPath $exe).VersionInfo.FileVersion
          Write-Output "Expected FileVersion: $expected"
          Write-Output "Actual FileVersion: $actual"
          if ($actual -ne $expected) {
            throw "Windows FileVersion 不一致"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          )
          if ($candidates.Where({ Test-Path -LiteralPath $_ }).Count -eq 0) {
            choco install innosetup --no-progress -y
          }

      - name: Build EXE Installer and Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-ChildItem -Path "build\windows" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\runner\\Release$" } |
            Select-Object -First 1
          if ($null -eq $source) {
            throw "未找到 Windows Release 目录"
          }
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          ).Where({ Test-Path -LiteralPath $_ }) | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($iscc)) {
            $iscc = (Get-Command "ISCC.exe").Source
          }

          .\windows\packaging\exe\build_installer.ps1 `
            -SourceDir $source.FullName `
            -AppVersion "${{ steps.version.outputs.app_version }}" `
            -BuildNumber "${{ steps.version.outputs.build_number }}" `
            -RunNumber "${{ steps.version.outputs.run_number }}" `
            -OutputDir "artifacts\windows" `
            -IsccPath $iscc

          $zipName = "yuanying-windows-x64-portable-v${{ steps.version.outputs.display_version }}-r${{ steps.version.outputs.run_number }}.zip"
          Compress-Archive `
            -Path (Join-Path $source.FullName "*") `
            -DestinationPath (Join-Path "artifacts\windows" $zipName) `
            -CompressionLevel Optimal `
            -Force

      - name: Verify Output Names
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedExe = "yuanying-windows-x64-v${{ steps.version.outputs.display_version }}-r${{ steps.version.outputs.run_number }}.exe"
          $expectedZip = "yuanying-windows-x64-portable-v${{ steps.version.outputs.display_version }}-r${{ steps.version.outputs.run_number }}.zip"
          $files = Get-ChildItem -LiteralPath "artifacts\windows" -File
          $files | Select-Object Name, Length
          if (-not (Test-Path -LiteralPath (Join-Path "artifacts\windows" $expectedExe))) {
            throw "缺少预期安装包: $expectedExe"
          }
          if (-not (Test-Path -LiteralPath (Join-Path "artifacts\windows" $expectedZip))) {
            throw "缺少预期便携包: $expectedZip"
          }

      - name: Upload Windows Packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.zip
          archive: false
          retention-days: 30
